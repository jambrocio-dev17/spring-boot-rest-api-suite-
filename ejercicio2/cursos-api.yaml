openapi: 3.0.3
info:
  title: API de Administración de Cursos Universitarios
  description: API para gestionar los cursos ofrecidos por una universidad.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api

tags:
  - name: Cursos

paths:
  /cursos:
    post:
      tags: [Cursos]
      summary: Crear un nuevo curso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CursoRequest'
            example:
              nombre: "Física II"
              codigo: "FIS-202"
              creditos: 4
              estado: "ACTIVO"
      responses:
        '201':
          description: Curso creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursoResponse'
        '400':
          description: Datos inválidos en la solicitud
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [Cursos]
      summary: Consultar todos los cursos
      responses:
        '200':
          description: Lista de cursos registrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CursoResponse'

  /cursos/codigo/{codigo}:
    get:
      tags: [Cursos]
      summary: Consultar un curso por código
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
          example: "FIS-202"
      responses:
        '200':
          description: Curso encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursoResponse'
        '404':
          description: No existe un curso con ese código
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /cursos/{id}:
    put:
      tags: [Cursos]
      summary: Actualizar un curso existente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CursoRequest'
      responses:
        '200':
          description: Curso actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursoResponse'
        '400':
          description: Datos inválidos en la solicitud
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe un curso con ese id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Cursos]
      summary: Eliminar un curso
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Curso eliminado correctamente (sin contenido)
        '404':
          description: No existe un curso con ese id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    CursoRequest:
      type: object
      required: [nombre, codigo, creditos, estado]
      properties:
        nombre:
          type: string
          example: "Física II"
        codigo:
          type: string
          example: "FIS-202"
        creditos:
          type: integer
          example: 4
        estado:
          type: string
          enum: [ACTIVO, INACTIVO]
          example: "ACTIVO"

    CursoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nombre:
          type: string
          example: "Física II"
        codigo:
          type: string
          example: "FIS-202"
        creditos:
          type: integer
          example: 4
        estado:
          type: string
          enum: [ACTIVO, INACTIVO]
          example: "ACTIVO"

    ErrorResponse:
      type: object
      properties:
        mensaje:
          type: string
          example: "No existe un curso con el código proporcionado"
        codigo:
          type: integer
          example: 404