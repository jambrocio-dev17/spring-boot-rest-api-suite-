openapi: 3.0.3
info:
  title: API de Administración de Reservas de Hotel
  description: API para gestionar las reservas de habitaciones de un hotel.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api

tags:
  - name: Reservas

paths:
  /reservas:
    post:
      tags: [Reservas]
      summary: Crear una nueva reserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaRequest'
            example:
              nombreCliente: "Josue Ambrocio"
              habitacion: "203"
              fechaEntrada: "2026-10-01"
              fechaSalida: "2026-10-05"
              estado: "CONFIRMADA"
      responses:
        '201':
          description: Reserva creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '400':
          description: Datos inválidos en la solicitud
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [Reservas]
      summary: Consultar todas las reservas
      responses:
        '200':
          description: Lista de reservas registradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservaResponse'

  /reservas/{id}:
    get:
      tags: [Reservas]
      summary: Consultar una reserva por id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Reserva encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '404':
          description: No existe una reserva con ese id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Reservas]
      summary: Actualizar una reserva existente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaRequest'
      responses:
        '200':
          description: Reserva actualizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '400':
          description: Datos inválidos en la solicitud
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No existe una reserva con ese id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reservas/{id}/cancelar:
    patch:
      tags: [Reservas]
      summary: Cancelar una reserva
      description: Cambia el estado de la reserva a CANCELADA (no elimina el registro).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Reserva cancelada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '404':
          description: No existe una reserva con ese id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ReservaRequest:
      type: object
      required: [nombreCliente, habitacion, fechaEntrada, fechaSalida, estado]
      properties:
        nombreCliente:
          type: string
          example: "Josue Ambrocio"
        habitacion:
          type: string
          example: "203"
        fechaEntrada:
          type: string
          format: date
          example: "2026-10-01"
        fechaSalida:
          type: string
          format: date
          example: "2026-10-05"
        estado:
          type: string
          enum: [PENDIENTE, CONFIRMADA, CANCELADA]
          example: "CONFIRMADA"

    ReservaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nombreCliente:
          type: string
          example: "Josue Ambrocio"
        habitacion:
          type: string
          example: "203"
        fechaEntrada:
          type: string
          format: date
          example: "2026-10-01"
        fechaSalida:
          type: string
          format: date
          example: "2026-10-05"
        estado:
          type: string
          enum: [PENDIENTE, CONFIRMADA, CANCELADA]
          example: "CONFIRMADA"

    ErrorResponse:
      type: object
      properties:
        mensaje:
          type: string
          example: "No existe una reserva con el id proporcionado"
        codigo:
          type: integer
          example: 404